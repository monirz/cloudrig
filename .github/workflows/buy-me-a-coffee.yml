name: Buy Me A Coffee Readme

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC

permissions:
  contents: write # the action commits the updated README

jobs:
  bmac-readme:
    name: Update the Buy Me A Coffee section in the README
    runs-on: ubuntu-latest
    steps:
      - uses: akosbalasko/coffee-readme@021a2db498f0682fe902eca059c04cc800825c0a # 1.0.4
        with:
          BUY_ME_A_COFFEE_TOKEN: ${{ secrets.BUY_ME_A_COFFEE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
