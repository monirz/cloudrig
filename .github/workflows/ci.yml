name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Two runners on purpose: the library entry point must work with no Docker
    # daemon present, and the macOS runner has none.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      # One target, so CI and a developer run the same thing. make check is
      # build + vet + the timer lint + gofmt + go test -race.
      - name: check
        run: make check

  vuln:
    # Its own job: a vulnerability database changes without this repo changing,
    # so a red scan should not read as a broken build. One runner is enough —
    # the report is about the module and its dependencies, not the platform.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      - name: govulncheck
        run: make vuln
