name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Two runners on purpose: the library entry point must work with no Docker
    # daemon present, and the macOS runner has none.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      # The lint package carries the timer check, so ./... covers acceptance
      # criterion 10 without a separate step.
      - name: test
        run: go test -race ./...
