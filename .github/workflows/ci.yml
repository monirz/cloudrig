name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Two runners on purpose: the library entry point must work with no Docker
    # daemon present, and the macOS runner has none.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      # One target, so CI and a developer run the same thing. make check is
      # build + vet + the timer lint + gofmt + go test -race.
      - name: check
        run: make check

  coverage:
    # Coverage on one runner, with gcloud installed so the compatibility tests
    # run for real instead of skipping. -coverpkg counts code any test reaches,
    # so the conformance suite's coverage of every service is credited.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - name: coverage
        run: |
          go test ./... -covermode=atomic \
            -coverpkg="$(go list ./... | grep -v /examples | paste -sd, -)" \
            -coverprofile=coverage.out
      - uses: codecov/codecov-action@5975040f7f7d40edaff8d784b576fd65ae95c073 # v5.5.5
        with:
          files: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  vuln:
    # Its own job: a vulnerability database changes without this repo changing,
    # so a red scan should not read as a broken build. One runner is enough —
    # the report is about the module and its dependencies, not the platform.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      - name: govulncheck
        run: make vuln
